name: Compilar APK desde ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Instalar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Buscar ZIP de Geo Susu
        id: zip
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -iname "*.zip" \
            -not -path "./extracted/*" \
            -printf '%T@ %p\n' \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2-)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró ningún ZIP."
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extraer ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.zip.outputs.zip }}" -d extracted

          echo "ZIP extraído correctamente"

      - name: Buscar proyecto Android
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Proyecto encontrado:"
          echo "$PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Comprobar Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "Android SDK: $SDK"

          if [ ! -f "$SDK/platforms/android-34/android.jar" ]; then
            echo "ERROR: Android SDK 34 no está instalado"
            exit 1
          fi

          if [ ! -d "$SDK/build-tools/34.0.0" ]; then
            echo "ERROR: Build Tools 34.0.0 no están instalados"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Preparar local.properties
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.dir }}"

          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT/local.properties"

          echo "local.properties creado"

      - name: Instalar Gradle 8.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.6"
          cache-disabled: true

      - name: Verificar versiones
        shell: bash
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Compilar Geo Susu
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.dir }}"

          cd "$PROJECT"

          echo "Compilando desde:"
          pwd

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Buscar APK generado
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.dir }}"

          mkdir -p salida

          APK=$(find "$PROJECT" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No se encontró el APK"
            find "$PROJECT" -type f -name "*.apk"
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          cp "$APK" salida/Geo-Susu-v196-debug.apk

          ls -lh salida/

      - name: Subir APK
        uses: actions/upload-artifact@v6
        with:
          name: Geo-Susu-v196-APK
          path: salida/Geo-Susu-v196-debug.apk
          if-no-files-found: error
